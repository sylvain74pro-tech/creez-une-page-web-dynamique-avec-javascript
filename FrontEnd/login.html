<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Log In - Sophie Bluel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>

    <!-- ================================================================= -->
    <!-- EN-TÊTE                                                           -->
    <!-- ================================================================= -->
    <header>
        <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
        <nav>
            <ul>
                <li><a href="index.html">projets</a></li>
                <li><a href="index.html#contact">contact</a></li>
                <li><a href="login.html" class="active">login</a></li>
                <li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
            </ul>
        </nav>
    </header>

    <!-- ================================================================= -->
    <!-- CONTENU PRINCIPAL / FORMULAIRE DE CONNEXION                       -->
    <!-- ================================================================= -->
    <main id="login">
        <h2>Log In</h2>

        <form id="login-form">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Se connecter</button>

            <p id="login-error" role="alert" aria-live="polite"></p>

            <a href="#" class="forgot">Mot de passe oublié</a>
        </form>
    </main>

    <!-- ================================================================= -->
    <!-- PIED DE PAGE                                                      -->
    <!-- ================================================================= -->
    <footer>
        <nav>
            <ul>
                <li>Mentions légales</li>
            </ul>
        </nav>
    </footer>

    <!-- ================================================================= -->
    <!-- SCRIPT JAVASCRIPT                                                 -->
    <!-- ================================================================= -->
    <script src="./js/login.js"></script>

</body>
</html>
