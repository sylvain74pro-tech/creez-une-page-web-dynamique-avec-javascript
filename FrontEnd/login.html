<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connexion | Sophie Bluel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap" rel="stylesheet">
    <meta name="description" content="Connectez-vous à votre compte pour accéder à votre espace personnel.">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header>
        <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="./index.html">projets</a></li>
                <li><a href="./index.html#contact">contact</a></li>
                <li class="active"><a href="./login.html" aria-current="page">login</a></li>
                <li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login" aria-labelledby="login-title">
            <h2 id="login-title">Log In</h2>
            <form action="./index.html" method="get">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <input type="submit" value="Se connecter">
            </form>
        </section>
    </main>

    <footer>
        <nav aria-label="Liens légaux">
            <ul><li>Mentions Légales</li></ul>
        </nav>
    </footer>

</body>
</html>
